<!-- Mermaid.js and MathJax Integration for GitHub Pages -->

<!-- MathJax for rendering LaTeX math: $$...$$ and $...$ -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Mermaid.js for rendering flowchart and sequence diagrams -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  document.addEventListener("DOMContentLoaded", function () {
    // Select all mermaid code blocks generated by Jekyll / Kramdown
    const selector = "pre code.language-mermaid, div.language-mermaid pre code, .language-mermaid > pre > code, code.language-mermaid, pre.language-mermaid";
    const codeBlocks = document.querySelectorAll(selector);

    codeBlocks.forEach(function (code) {
      // Find the outermost container element created by the syntax highlighter
      let container = code.closest(".language-mermaid") || code.closest("pre");
      if (!container) container = code;

      const div = document.createElement("div");
      div.className = "mermaid";
      div.style.textAlign = "center";
      div.style.margin = "25px 0";
      div.textContent = code.textContent;

      container.parentNode.replaceChild(div, container);
    });

    // Initialize and render all diagrams
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose',
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'basis'
      }
    });

    mermaid.run();
  });
</script>
